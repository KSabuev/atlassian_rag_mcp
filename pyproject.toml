[project]
name = "atlassian-rag-mcp"
version = "1.0.0"
description = "MCP server for Atlassian RAG hybrid search (vector + FTS)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "atlassian-python-api>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.31.0",
    "tantivy>=0.22.0",
    "snowballstemmer>=2.2.0",
    "qdrant-client>=1.15.1",
    "lancedb>=0.30.0",
    "pyarrow>=15.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "python-pptx>=0.6.23",
    "pdfplumber>=0.11.0",
    "striprtf>=0.0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.5.0",
    "xlwt>=1.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["atlassian_rag_mcp"]

[project.scripts]
atlassian-rag-mcp = "atlassian_rag_mcp.__main__:main"

[tool.mcp]
name = "atlassian-rag-mcp-search"
description = "Hybrid vector + FTS search for Atlassian documentation"

[tool.hatch.build.targets.wheel]
packages = ["src/atlassian_rag_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
